<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --navy:#0C2340;
    --navy-2:#123467;
    --blue:#1E5FFF;
    --saffron:#C2410C;
    --green:#146C43;
    --bg:#F6F8FC;
    --card:#FFFFFF;
    --text:#1A2433;
    --muted:#5B6B80;
    --border:#E4E9F1;
    --radius:16px;
    --shadow: 0 4px 24px rgba(12,35,64,0.06);
  }
  [data-theme="dark"]{
    --navy:#0A192E;
    --navy-2:#0F2647;
    --bg:#0B1424;
    --card:#101B2E;
    --text:#EAF0FA;
    --muted:#8FA0B8;
    --border:#1E2C42;
    --saffron:#FF9A4D;
    --green:#34D399;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{overflow-x:hidden;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand-name{font-family:'Sora',sans-serif;}
  a{text-decoration:none; color:inherit;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:100;
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; max-width:1280px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:12px; flex-shrink:0;}
  .brand-emblem{height:44px; width:auto; display:block; flex-shrink:0;}
  .brand-wordmark{height:26px; width:auto; display:block; flex-shrink:0;}

  .nav-links{display:flex; align-items:center; gap:28px; list-style:none;}
  .nav-links a{font-size:14.5px; font-weight:500; color:var(--text); opacity:.85; transition:opacity .2s;}
  .nav-links a.active{color:var(--blue); opacity:1; font-weight:600;}
  .nav-links a:hover{opacity:1;}

  .nav-actions{display:flex; align-items:center; gap:12px;}
  .icon-btn{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); border:1px solid var(--border);
    color:var(--muted); transition:all .2s;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--border);}
  .btn-primary{
    background:var(--navy); color:#fff; padding:10px 20px; border-radius:10px;
    font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px;
    transition:background .2s, transform .15s;
    min-height:44px;
  }
  .btn-primary:hover{background:var(--blue); transform:translateY(-1px);}
  .hamburger{display:none; flex-direction:column; gap:5px; width:44px; height:44px; align-items:center; justify-content:center; flex-shrink:0;}
  .hamburger span{width:20px; height:2px; background:var(--text); border-radius:2px;}

  .mobile-menu{
    display:none; flex-direction:column; background:var(--card); border-top:1px solid var(--border);
    padding:10px 24px 20px;
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu a{padding:12px 0; font-size:15px; font-weight:500; border-bottom:1px solid var(--border);}

  /* ---------- Page hero ---------- */
  .du-hero{
    background:linear-gradient(180deg, #EEF2FA 0%, var(--bg) 100%);
    padding:52px 0 40px;
  }
  [data-theme="dark"] .du-hero{background:linear-gradient(180deg, #0D1B30 0%, var(--bg) 100%);}
  .du-hero .eyebrow{color:var(--green); font-weight:700; font-size:12.5px; letter-spacing:.4px; margin-bottom:12px;}
  .du-hero h1{font-size:clamp(28px, 3.6vw, 40px); font-weight:800; letter-spacing:-.5px;}
  .du-hero p{color:var(--muted); font-size:15.5px; line-height:1.7; max-width:560px; margin-top:10px;}

  /* ---------- Category sections ---------- */
  .du-main{padding:36px 0 64px;}
  .du-cat{margin-bottom:36px; display:none;}
  .du-cat.active{display:block;}

  /* ---------- Category picker tiles ---------- */
  .du-cats{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:16px;}
  .cat-tile{
    text-align:left; background:var(--card); border:1px solid var(--border); border-top:4px solid transparent;
    border-radius:var(--radius); padding:22px; cursor:pointer; transition:transform .15s, box-shadow .2s, border-color .2s;
    display:flex; flex-direction:column; gap:6px; color:var(--text);
  }
  .cat-tile:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .cat-tile.sec{border-top-color:var(--blue);}
  .cat-tile.vac{border-top-color:var(--saffron);}
  .cat-tile.aec{border-top-color:var(--navy-2);}
  .cat-tile.ge{border-top-color:var(--green);}
  .cat-ico{font-size:26px;}
  .cat-name{font-family:'Sora',sans-serif; font-size:20px; font-weight:800; letter-spacing:.2px;}
  .cat-sub{font-size:13px; color:var(--muted);}
  .cat-count{font-size:12.5px; font-weight:600; color:var(--blue); margin-top:6px;}
  #catPicker.hidden{display:none;}

  /* ---------- Page section headings (1. / 2.) ---------- */
  .du-sec{margin-bottom:44px;}
  .du-sec-head{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .du-sec-head .num{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    background:var(--navy); color:#fff; font-family:'Sora',sans-serif;
    font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .du-sec-head h2{font-size:clamp(18px, 2.4vw, 22px); font-weight:800; letter-spacing:-.3px;}
  .du-sec-head .sub{font-size:13px; color:var(--muted); margin-top:2px;}

  /* ---------- Core Subjects grid ---------- */
  .core-note{
    display:flex; gap:14px; align-items:flex-start;
    background:linear-gradient(135deg, rgba(255,153,51,.10), rgba(19,161,85,.08));
    border:1px solid rgba(255,153,51,.45); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:18px; font-size:14px; line-height:1.6;
  }
  .core-note-ico{font-size:24px; line-height:1;}
  .core-note .core-note-en{color:var(--muted);}
  .core-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;}
  .core-card{
    text-align:left; position:relative; overflow:hidden;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px 22px; cursor:pointer; color:var(--text);
    display:flex; flex-direction:column; gap:8px;
    transition:transform .15s, box-shadow .2s, border-color .2s;
  }
  .core-card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--blue);}
  .core-card .top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .core-ico{font-size:28px; line-height:1;}
  .core-badge{
    font-size:11px; font-weight:700; letter-spacing:.3px; padding:4px 9px; border-radius:100px;
    background:var(--bg); border:1px solid var(--border); color:var(--muted);
  }
  .core-name{font-family:'Sora',sans-serif; font-size:19px; font-weight:800; letter-spacing:.2px;}
  .core-desc{font-size:13px; color:var(--muted); line-height:1.5;}
  .core-count{font-size:12.5px; font-weight:600; color:var(--blue);}
  .core-btn{
    display:inline-flex; align-items:center; gap:6px; margin-top:6px;
    color:var(--blue); font-weight:700; font-size:13.5px;
  }
  .core-card:hover .core-btn{color:var(--saffron);}
  .core-prog{
    background:linear-gradient(135deg, rgba(255,153,51,.08), rgba(19,61,110,.10));
    border:1.5px dashed var(--saffron);
  }
  .core-prog:hover{border-color:var(--navy);}
  .core-prog .core-desc{color:var(--text); font-weight:600;}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.16); color:#fff;
    border:1px solid rgba(255,255,255,.3); padding:6px 12px; border-radius:8px;
    font-size:12.5px; font-weight:600; margin-bottom:10px;
  }
  .back-btn:hover{background:rgba(255,255,255,.3);}

  .du-cat-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:18px 22px; border-radius:var(--radius); color:#fff; margin-bottom:18px;
  }
  .du-cat-head.sec{background:linear-gradient(90deg, var(--blue), var(--navy-2));}
  .du-cat-head.vac{background:linear-gradient(90deg, var(--saffron), #e05a00);}
  .du-cat-head.aec{background:linear-gradient(90deg, var(--navy), var(--navy-2));}
  .du-cat-head.ge{background:linear-gradient(90deg, var(--green), #146b44);}
  .du-cat-head.core{background:linear-gradient(90deg, var(--navy), #2d5bd6);}
  .du-cat-head h2{font-size:20px;}
  .du-cat-head .sub{font-size:12.5px; opacity:.85; font-weight:500; display:block; margin-top:2px;}
  .upload-btn{
    display:none; background:rgba(255,255,255,.18); color:#fff; padding:9px 16px; border-radius:10px;
    font-size:13px; font-weight:600; border:1px solid rgba(255,255,255,.35);
  }
  body.is-admin .upload-btn{display:inline-flex; align-items:center; gap:6px;}
  .upload-btn:hover{background:rgba(255,255,255,.3);}
  body.is-admin .add-subj-btn{margin-right:8px;}
  .icon-btn{display:none; background:transparent; color:var(--muted); width:30px; height:30px;
    border-radius:8px; border:1px solid var(--border); font-size:14px; cursor:pointer; flex-shrink:0;}
  body.is-admin .icon-btn{display:inline-flex; align-items:center; justify-content:center;}
  .icon-btn:hover{background:var(--bg); color:var(--text);}

  /* ---------- Subject folders ---------- */
  .subj-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .subj-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px;
  }
  .subj-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; cursor:pointer; user-select:none;}
  .subj-title{font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .subj-title .chev{font-size:9px; color:var(--muted); transition:transform .2s ease;}
  .subj-card.closed .subj-title .chev{transform:rotate(-90deg);}
  .subj-card.closed .mat-list{display:none;}
  .subj-title .count{
    font-size:11.5px; font-weight:600; color:var(--muted); background:var(--bg);
    padding:3px 9px; border-radius:100px; border:1px solid var(--border);
  }
  .subj-head .upload-btn{width:auto; padding:6px 12px; font-size:12px;}
  .imp-btn{
    display:inline-flex; align-items:center; gap:4px;
    background:rgba(255,122,26,.12); color:var(--saffron);
    border:1px solid rgba(255,122,26,.35); padding:6px 12px; border-radius:8px;
    font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer;
  }
  .imp-btn:hover{background:var(--saffron); color:#fff;}
  .syl-btn{
    display:inline-flex; align-items:center; gap:4px;
    background:rgba(30,142,90,.12); color:var(--green);
    border:1px solid rgba(30,142,90,.35); padding:6px 12px; border-radius:8px;
    font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer;
  }
  .syl-btn:hover{background:var(--green); color:#fff;}
  .pyq-btn{
    display:inline-flex; align-items:center; gap:4px;
    background:rgba(38,82,164,.12); color:var(--blue);
    border:1px solid rgba(38,82,164,.35); padding:6px 12px; border-radius:8px;
    font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer;
  }
  .pyq-btn:hover{background:var(--blue); color:#fff;}
  .core-breadcrumb{font-size:12.5px; color:var(--muted); margin:-4px 0 14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .core-breadcrumb button{background:none; border:none; color:var(--blue); font-size:12.5px; font-weight:600; cursor:pointer; padding:0; font-family:inherit;}
  .core-breadcrumb button:hover{text-decoration:underline;}
  .core-breadcrumb .sep{color:var(--muted);}
  .core-breadcrumb .cur{font-weight:700; color:var(--text);}
  .core-sem-pills{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px;}
  .core-sem-pill{
    padding:9px 18px; border-radius:100px; border:1.5px solid var(--border);
    background:var(--card); color:var(--text); font-size:13.5px; font-weight:700; cursor:pointer;
    font-family:inherit; transition:all .15s ease;
  }
  .core-sem-pill:hover{border-color:var(--blue); color:var(--blue);}
  .core-sem-pill.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .core-sem-prompt{font-size:13px; color:var(--muted); margin:0 0 18px;}
  .core-chips{display:flex; flex-wrap:wrap; gap:8px; margin:-6px 0 18px;}
  .core-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--border); border-radius:100px;
    padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--text); cursor:pointer;
    font-family:inherit; text-decoration:none; transition:all .15s ease;
  }
  .core-chip:hover{border-color:var(--blue); color:var(--blue);}
  .core-chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}

  .mat-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; font-size:13px;
  }
  .mat-item .t{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mat-item .a{display:flex; gap:6px; flex-shrink:0;}
  .mat-item button{
    padding:5px 10px; border-radius:7px; font-size:12px; font-weight:600;
    background:var(--bg); border:1px solid var(--border); color:var(--text);
  }
  .mat-item button:hover{border-color:var(--green); color:var(--green);}
  .mat-item button.del-btn:hover{border-color:#d64545; color:#d64545;}
  .mat-item button.report-btn:hover{border-color:#e0a800; color:#b8860b;}
  .report-byline{font-size:12.5px; color:var(--muted); margin:-8px 0 14px; line-height:1.5;}
  #reportOverlay textarea.field{resize:vertical; min-height:70px; font-family:inherit;}
  .mat-empty{font-size:13px; color:var(--muted); text-align:center; padding:14px; border:1px dashed var(--border); border-radius:10px;}
  .du-load-error{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    margin:0 0 20px; padding:12px 16px; border-radius:12px;
    background:rgba(214,69,69,.08); border:1px solid rgba(214,69,69,.35); color:var(--text);
    font-size:13.5px; line-height:1.5;
  }
  .du-load-error button{
    margin-left:auto; padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:700;
    background:var(--text); border:none; color:var(--bg); cursor:pointer;
  }
  .du-load-error button:hover{opacity:.85;}
  .file-list{display:flex; flex-direction:column; gap:8px;}
  .mat-item .tags{font-size:11px; font-weight:600; color:var(--muted); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- Modals ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,20,40,.5); display:none;
    align-items:flex-start; justify-content:center; padding:16px; padding-top:6vh; z-index:200;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--card); width:min(420px, 92vw); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3);
    padding:24px; position:relative;
    max-height:min(88vh, 640px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal-box h3{font-size:18px; margin-bottom:16px;}
  .modal-box .field{
    width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px;
    background:var(--bg); color:var(--text); font-size:14.5px; font-family:inherit; margin-bottom:12px;
    outline:none;
  }
  .modal-box .field:focus{border-color:var(--blue);}
  .pass-wrap{position:relative;}
  .pass-wrap .field{padding-right:42px;}
  .pass-toggle{position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:17px; color:var(--muted); padding:8px; line-height:1; border-radius:8px;}
  .pass-toggle:hover{color:var(--text); background:var(--bg);}
  .modal-box .btn-primary{width:100%; justify-content:center; padding:12px;}
  .modal-msg{font-size:13px; margin-top:10px; min-height:18px;}
  .modal-msg.ok{color:var(--green);} .modal-msg.err{color:#d64545;}
  .modal-close{
    position:absolute; top:10px; right:10px; font-size:20px; color:var(--muted);
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{background:var(--bg);}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sel{appearance:none;}
  .up-suggest-wrap{position:relative;}
  .up-suggest{
    position:absolute; top:100%; left:0; right:0; z-index:50; margin-top:3px;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); max-height:190px; overflow:auto; display:none;
  }
  .up-suggest.show{display:block;}
  .up-suggest-item{padding:10px 14px; font-size:13.5px; cursor:pointer;}
  .up-suggest-item:hover{background:var(--bg); color:var(--blue);}
  .imp-check{
    display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;
    color:var(--saffron); margin:4px 0 12px; cursor:pointer; user-select:none;
  }
  .imp-check input{width:17px; height:17px; accent-color:var(--saffron); cursor:pointer;}
  .imp-check.syl{color:var(--green);}
  .imp-check.syl input{accent-color:var(--green);}
  .imp-check.pyq{color:var(--blue);}
  .imp-check.pyq input{accent-color:var(--blue);}

  footer{
    background:var(--navy); color:#cfd9ec; padding:40px 0 36px; text-align:center; font-size:13px;
  }
  footer a{color:#fff; font-weight:600;}
  footer a:hover{color:var(--saffron);}
  .footer-links{display:flex; flex-wrap:wrap; justify-content:center; gap:8px 22px; margin:18px 0; list-style:none;}

    <script>
  // ---------- Config ----------
  const SULAKSH_API = localStorage.getItem('sulaksh-api') || 'https://sulaksh-backend-production.up.railway.app';

  // All Sulaksh API calls authenticate via the HttpOnly session cookie only.
  // The token is never exposed to JS (so XSS can't exfiltrate it), and any
  // caller-supplied Authorization header is stripped.
  const _apiFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.startsWith(SULAKSH_API)) {
      init = Object.assign({}, init, { credentials: 'include' });
      if (init.headers && !init.headers.forEach) delete init.headers.Authorization;
      else if (init.headers && init.headers.forEach) init.headers.delete('Authorization');
    }
    return _apiFetch(input, init);
  };

  // Admin controls loader - only for verified admin (keeps raw HTML clean for anon)
  (function(){
    function loadAdminControls(){
      if (document.querySelector('script[src="/assets/js/admin-controls.js"]')) return;
      var s=document.createElement('script');
      s.src='/assets/js/admin-controls.js';
      document.head.appendChild(s);
    }
    // Defer loading until admin verified (state.isAdmin or SulakshAuth)
    function checkAndLoad(){
      var isAdmin = !!(window.state && window.state.isAdmin) || !!(window.SulakshAuth && window.SulakshAuth.st && (window.SulakshAuth.st.role==='admin'||window.SulakshAuth.st.role==='super'));
      if (isAdmin) loadAdminControls();
    }
    if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', checkAndLoad);
    else checkAndLoad();
    document.addEventListener('DOMContentLoaded', function(){
      if(window.SulakshAuth){ window.SulakshAuth.restore().then(function(){ if(window.SulakshAuth.st && (window.SulakshAuth.st.role==='admin'||window.SulakshAuth.st.role==='super')){ if(window.state) window.state.isAdmin=true; loadAdminControls(); }}); }
    });
  })();

  async function logout() {
    try { await fetch(`${SULAKSH_API}/api/auth/logout`, { method: 'POST' }); } catch (e) {}
    state.email = null; state.token = null; state.role = null;
    state.isAdmin = false; state.canMaintain = false;
    localStorage.removeItem('sulaksh-email');
    localStorage.removeItem('sulaksh-token');
    localStorage.removeItem('sulaksh-role');
    updateAuthUI();
    loadMaterials();
  }

  // Upl\u006fad
  function openUplOad(cat, subject, track, sem, matCat) {
    if (!state.isAdmin) { alert('Only the site admin can upload materials.'); return; }
    document.getElementById('upCat').value = cat || 'SEC';
    document.getElementById('upSubject').value = subject ? decodeURIComponent(subject) : '';
    document.getElementById('upTrack').value = track || '';
    document.getElementById('upSem').value = sem || '';
    document.getElementById('upCategory').value = matCat || '';
    document.getElementById('upTitle').value = '';
    document.getElementById('upYear').value = '';
    document.getElementById('upFile').value = '';
    document.getElementById('upImp').checked = false;
    document.getElementById('upSyl').checked = false;
    document.getElementById('upPyq').checked = false;
    setMsg(document.getElementById('uploadMsg'), '', false);
    syncCoreFields();
    hideSuggest();
    openModal('uploadOverlay');
  }
  window.openUplOad = openUplOad;

  function syncCoreFields() {
    const isCore = document.getElementById('upCat').value === 'CORE';
    document.getElementById('upTrack').style.display = isCore ? '' : 'none';
    document.getElementById('upSem').style.display = isCore ? '' : 'none';
    document.getElementById('upCategory').style.display = isCore ? '' : 'none';
    document.getElementById('upFlagsRow').style.display = isCore ? 'none' : '';
  }

  document.getElementById('uplOadSubmit').addEventListener('click', doUplOad);
  document.getElementById('upFile').addEventListener('change', () => {
    const f = document.getElementById('upFile').files[0];
    const t = document.getElementById('upTitle');
    if (f && !t.value) t.value = f.name.replace(/\.pdf$/i, '');
  });

  document.addEventListener('DOMContentLoaded', function () { SulakshOptimizer.bind('upFile', 'upOptInfo'); });

  async function doUplOad() {
    const msg = document.getElementById('uploadMsg');
    const category = document.getElementById('upCat').value;
    const subject = document.getElementById('upSubject').value.trim();
    const title = document.getElementById('upTitle').value.trim();
    const year = document.getElementById('upYear').value.trim();
    const fileInput = document.getElementById('upFile');
    const file = fileInput.files[0];
    if (!subject || !title || !file) return setMsg(msg, 'Subject folder, file title and a PDF are required.', false);

    let uploadFile;
    try {
      const opt = fileInput.__getOptimized ? await fileInput.__getOptimized() : await SulakshOptimizer.prepare(file);
      if (!opt || !opt.ok) throw new Error((opt && opt.error) || 'File optimization failed.');
      uploadFile = opt.blob || file;
    } catch (err) {
      return setMsg(msg, err.message || 'File optimization failed.', false);
    }

    const fd = new FormData();
    fd.append('title', title);
    fd.append('exam', 'DU & College');
    fd.append('category', category);
    fd.append('subject', subject);
    const track = document.getElementById('upTrack').value.trim();
    const sem = document.getElementById('upSem').value.trim();
    const matCat = document.getElementById('upCategory').value.trim();
    let isImp = document.getElementById('upImp').checked;
    let isSyl = document.getElementById('upSyl').checked;
    let isPyq = document.getElementById('upPyq').checked;
    if (category === 'CORE') {
      if (!sem) return setMsg(msg, 'Select a Semester (1–8) for Core Subjects — every upload needs a clear semester.', false);
      if (!matCat) return setMsg(msg, 'Select a Material Category (Syllabus, Notes, PYQs, etc.) for Core Subjects.', false);
      isImp = matCat === 'important-questions';
      isSyl = matCat === 'syllabus';
      isPyq = matCat === 'pyqs';
    }
    if (track) fd.append('track', track);
    if (sem) fd.append('semester', sem);
    if (category === 'CORE' && matCat) fd.append('material_category', matCat);
    fd.append('is_imp', isImp ? 'true' : 'false');
    fd.append('is_syllabus', isSyl ? 'true' : 'false');
    fd.append('is_pyq', isPyq ? 'true' : 'false');
    if (year) fd.append('year', year);
    fd.append('file', uploadFile, uploadFile.name || file.name);

    try {
      const res = await postUplOad(`${SULAKSH_API}/api/admin/materials`, {
        method: 'POST',
        headers: {},
        body: fd,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Upl\u006fad failed.');
      setMsg(msg, 'Upl\u006faded successfully!', true);
      setTimeout(() => closeModal('uploadOverlay'), 1200);
      loadMaterials();
    } catch (err) {
      setMsg(msg, err.message, false);
    }
  }

  // Materials
  // Fetch with timeout + automatic retries with backoff — a slow or sleeping
  // backend, a single dropped request, or a transient 5xx should never leave
  // sections of the page silently showing "0 materials".
  const DU_MAT_CACHE_KEY = 'sulaksh-du-cache-v1';
  const DU_SUBJECT_CACHE_KEY = 'sulaksh-du-subjects-v1';
  const DU_FETCH_TIMEOUT_MS = 12000;

  function cacheGet(key, ttlMs) {
    try {
      const raw = sessionStorage.getItem(key);
      if (!raw) return null;
      const row = JSON.parse(raw);
      if (Date.now() - row.t > ttlMs) return null;
      return row.v;
    } catch (e) { return null; }
  }
  function cacheSet(key, value) {
    try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), v: value })); } catch (e) {}
  }
  function cacheSetLong(key, value) {
    // localStorage survives reloads/tab closes — longer fallback window.
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v: value })); } catch (e) {}
  }
  function cacheGetLong(key, ttlMs) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const row = JSON.parse(raw);
      if (Date.now() - row.t > ttlMs) return null;
      return row.v;
    } catch (e) { return null; }
  }

  async function fetchJsonRetry(url, tries = 3) {
    let lastErr = null;
    for (let i = 0; i < tries; i++) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), DU_FETCH_TIMEOUT_MS);
      try {
        const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(timer);
        if (r.ok) return await r.json();
        // 429 / 5xx are transient — back off and retry rather than giving up.
        if (r.status === 429 || r.status >= 500) {
          lastErr = new Error('server ' + r.status);
        } else {
          return null;
        }
      } catch (e) {
        clearTimeout(timer);
        lastErr = e.name === 'AbortError' ? new Error('timeout') : e;
      }
      if (i < tries - 1) await new Promise((res) => setTimeout(res, 500 * (i + 1)));
    }
    window.__duLastErr = lastErr ? lastErr.message : 'unknown';
    return null;
  }

  // Try the primary API base, then fall back to the backend directly so the
  // materials page keeps working even if the same-origin worker proxy is
  // unreachable from a given client/network.
  const RAILWAY_API_FALLBACK = 'https://sulaksh-backend-production.up.railway.app';
  async function apiGet(path) {
    let d = await fetchJsonRetry(SULAKSH_API + path);
    if (d) return d;
    try { d = await fetchJsonRetry(RAILWAY_API_FALLBACK + path); } catch (e) { d = null; }
    return d;
  }

  function showDuErrorBanner() {
    let banner = document.getElementById('duLoadError');
    if (banner) return;
    banner = document.createElement('div');
    banner.id = 'duLoadError';
    banner.className = 'du-load-error';
    banner.innerHTML =
      '<strong>Could not load the latest materials.</strong> ' +
      'Your connection to our server hit a snag' +
      (window.__duLastErr ? ' (' + String(window.__duLastErr).replace(/[<>]/g, '') + ')' : '') +
      '. <button type="button" onclick="window.__duRetryLoad()">Retry</button>';
    const hero = document.querySelector('.du-main');
    if (hero) hero.insertBefore(banner, hero.firstChild);
  }

  async function loadMaterials({ showErrors = true } = {}) {
    duLoading = true;
    // Show loading in semester pills if user is already in that view
    try { renderSemPills(window.__coreSubject || '', window.__coreSem ? Number(window.__coreSem) : null); } catch(e){}
    let data = null;
    let subjectDBLocal = [];
    let fromCache = false;
    try {
      // (1) Static snapshot served from the site itself — always available,
      // independent of the backend, so materials never disappear.
      const [smats, ssubs] = await Promise.all([
        fetchJsonRetry(`${location.origin}/assets/data/materials.json`),
        fetchJsonRetry(`${location.origin}/assets/data/subjects.json`),
      ]);
      if (smats && Array.isArray(smats.materials)) {
        data = smats;
        subjectDBLocal = (ssubs && Array.isArray(ssubs.subjects)) ? ssubs.subjects : [];
      }
    } catch (err) { /* snapshot missing — fall through to live */ }

    // (2) Live API for fresher data when reachable (worker, then backend direct).
    try {
      const [d, sd] = await Promise.all([
        apiGet('/api/materials'),
        apiGet('/api/subjects?exam=' + encodeURIComponent('DU & College')),
      ]);
      if (d) {
        data = d;
        subjectDBLocal = (sd && sd.subjects) || [];
        cacheSet(DU_MAT_CACHE_KEY, data.materials || []);
        cacheSet(DU_SUBJECT_CACHE_KEY, subjectDBLocal);
        cacheSetLong(DU_MAT_CACHE_KEY, data.materials || []);
        cacheSetLong(DU_SUBJECT_CACHE_KEY, subjectDBLocal);
      }
    } catch (err) { /* keep static snapshot / cache */ }

    if (!data) {
      // Last-known-good fallback: show the cached materials the visitor (or a
      // previous session) already loaded, instead of a wrong "0 materials".
      const cachedMats =
        cacheGet(DU_MAT_CACHE_KEY, 24 * 60 * 60 * 1000) ||
        cacheGetLong(DU_MAT_CACHE_KEY, 7 * 24 * 60 * 60 * 1000);
      const cachedSubs =
        cacheGet(DU_SUBJECT_CACHE_KEY, 24 * 60 * 60 * 1000) ||
        cacheGetLong(DU_SUBJECT_CACHE_KEY, 7 * 24 * 60 * 60 * 1000);
      if (cachedMats && cachedMats.length) {
        data = { materials: cachedMats };
        subjectDBLocal = Array.isArray(cachedSubs) ? cachedSubs : [];
        fromCache = true;
      }
    }

    subjectDB = subjectDBLocal;

    if (!data) {
      // No live data and no cache: static lists so nothing ever disappears
      // completely, plus a visible retry banner instead of silent "0".
      coreMaterials = [];
      CATEGORIES.forEach((cat) => {
        if (cat === 'CORE') return;
        const staticList = STATIC_SUBJECTS[cat];
        if (staticList && staticList.length) {
          try { renderCategory(cat, []); } catch (e) { console.error('[du] render ' + cat, e); }
          const countEl = document.getElementById('catCount-' + cat);
          if (countEl) countEl.textContent = staticList.length + ' subject' + (staticList.length === 1 ? '' : 's');
        } else {
          const g = document.getElementById('subj-' + cat);
          if (g) g.innerHTML = '<div class="mat-empty">Could not load materials.</div>';
        }
      });
      renderCoreGrid([]);
      duLoading = false;
      try { renderSemPills(window.__coreSubject || '', window.__coreSem ? Number(window.__coreSem) : null); } catch(e){}
      if (showErrors) showDuErrorBanner();
      return;
    }

    try {
      const mats = (data.materials || []).filter((m) => (m.exam || '').toLowerCase() === 'du & college');
      materialsCache = mats;
      coreMaterials = mats.filter((m) => (m.category || '').toUpperCase() === 'CORE');
      // Core grid renders FIRST — it must never be left blank because a
      // later category failed.
      renderCoreGrid(mats);
      CATEGORIES.forEach((cat) => {
        const catMats = mats.filter((m) => (m.category || '').toUpperCase() === cat);
        dynamicSubjects[cat] = Array.from(new Set(catMats.map((m) => m.subject || 'General').filter(Boolean)));
        if (cat === 'CORE') return;
        try { renderCategory(cat, catMats); } catch (e) { console.error('[du] render ' + cat, e); }
        const countEl = document.getElementById('catCount-' + cat);
        if (countEl) countEl.textContent = catMats.length + ' file' + (catMats.length === 1 ? '' : 's');
      });
      duLoading = false;
      try { renderSemPills(window.__coreSubject || '', window.__coreSem ? Number(window.__coreSem) : null); } catch(e){}
      // Re-render current core view if user navigated before data arrived (fix race: pills stuck empty)
      try {
        const curView = window.__coreViewId;
        const curSub = window.__coreSubject;
        const curTrack = window.__coreTrack;
        const curSem = window.__coreSem;
        const curCat = window.__coreCat;
        if (curSub && curView) {
          if (curView === 'viewCoreSubject' && curSub) {
            if (curSem) renderCoreSubjectSem(curSub, curSem);
            else renderCoreSubjectView(curSub, curTrack);
          } else if (curView === 'viewCoreTrack' && curSub) {
            renderCoreTrackView(curSub);
          } else if (curView === 'viewCoreCategory' && curSub && curSem && curCat) {
            renderCoreCategoryView(curSub, curSem, curCat);
          } else if (curView === 'viewCoreSubject' || curView === 'viewCoreTrack' || curView === 'viewCoreCategory') {
            // Fallback: refresh pills if still in loading state
            renderSemPills(curSub, curSem ? Number(curSem) : null);
          }
        }
      } catch(e){ console.error('[du] reload current view', e); }

      const banner = document.getElementById('duLoadError');
      if (banner) banner.remove();
      if (fromCache && showErrors) {
        showDuErrorBanner();
        const b2 = document.getElementById('duLoadError');
        if (b2) {
          b2.innerHTML =
            '<strong>Showing saved materials.</strong> ' +
            'Our live server is temporarily unreachable — these are from your last visit. ' +
            '<button type="button" onclick="window.__duRetryLoad()">Retry now</button>';
        }
      }
    } catch (err) {
      console.error('[du] loadMaterials render error:', err);
      renderCoreGrid([]);
    } finally {
      duLoading = false;
      // Ensure pills exit loading state if still showing
      try { renderSemPills(window.__coreSubject || '', window.__coreSem ? Number(window.__coreSem) : null); } catch(e){}
    }
  }

  window.__duRetryLoad = function () {
    const banner = document.getElementById('duLoadError');
    if (banner) banner.remove();
    loadMaterials();
  };

  function renderCoreGrid(mats) {
    const grid = document.getElementById('coreGrid');
    if (!grid) return;
    const proFiles = CORE_PROGRAMMES.map((p) => p.file);
    const proCount = (mats || []).filter((m) => m.category && m.category.toUpperCase() === 'CORE' && proFiles.includes(m.subject || '')).length;
    grid.innerHTML = CORE_SUBJECTS.map((s) => {
      const meta = CORE_META[s] || { ico: '📘', tag: 'Core' };
      const PROG_TAG = ({ 'English':'BA','History':'BA','Economics':'BA','Political Science':'BA','Hindi':'BA','Mathematics':'BA/BSc','Sociology':'BA','B.Sc.':'BSc' })[s] || '';
      let files;
      if (s === 'B.Sc.') {
        files = (mats || []).filter((m) => (m.category || '').toUpperCase() === 'CORE' && BSC_SUBJECTS.includes(m.subject || ''));
      } else {
        files = (mats || []).filter((m) => (m.category || '').toUpperCase() === 'CORE' && (m.subject || '') === s);
      }
      const n = files.length;
      return `
        <button class="core-card" onclick="openCoreSubject('${s.replace(/'/g, "\\'")}')">
          <div class="top">
            <span class="core-ico">${meta.ico}</span>${PROG_TAG ? `<span style="font-size:10.5px;font-weight:800;background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:100px;letter-spacing:.5px;">${PROG_TAG}</span>` : ''}
            <span class="core-badge">${n} file${n === 1 ? '' : 's'}</span>
          </div>
          <span class="core-name">${s}</span>
          <span class="core-desc">Notes, PYQs, Question Banks &amp; More</span>
          <span class="core-count" id="coreCount-${s}">${n} materials</span>
          <span class="core-btn">Explore →</span>
        </button>`;
    }).join('') + `
      <button class="core-card core-prog" onclick="openCoreProgrammes()">
        <div class="top">
          <span class="core-ico">${CORE_PROGRAMME_SECTION.ico}</span>
          <span class="core-badge">${proCount} file${proCount === 1 ? '' : 's'}</span>
        </div>
        <span class="core-name">${CORE_PROGRAMME_SECTION.name}</span>
        <span class="core-desc">Syllabus अभी भी नहीं मिला? इसमें सब कुछ मिलेगा!<br>Still can't find the syllabus? Everything is here!</span>
        <span class="core-count">${proCount} materials</span>
        <span class="core-btn">Open →</span>
      </button>`;
  }

  function renderCategory(cat, mats) {
    const grid = document.getElementById('subj-' + cat);
    if (!grid) return;
    const bySubject = {};
    mats.forEach((m) => { const s = m.subject || 'General'; (bySubject[s] = bySubject[s] || []).push(m); });

    let base;
    const dbNames = subjectDB.filter((s) => s.category === cat).map((s) => s.name);
    if (dbNames.length) {
      base = dbNames;
    } else if (STATIC_SUBJECTS[cat]) {
      base = STATIC_SUBJECTS[cat].slice();
    } else {
      base = [];
    }

    let subjectNames = base.slice();
    Object.keys(bySubject).forEach((s) => { if (s !== 'Others' && !subjectNames.includes(s)) subjectNames.push(s); });
    subjectNames = subjectNames.filter((s) => s !== 'Others');
    if (base.includes('Others') || (bySubject['Others'] || []).length) subjectNames.push('Others');

    if (!subjectNames.length) {
      grid.innerHTML = '<div class="mat-empty">No subjects yet.' + (state.isAdmin ? ' Use the Upl\u006fad button above to add the first subject.' : '') + '</div>';
      return;
    }

    grid.innerHTML = subjectNames.map((s) => subjectCard(cat, s, bySubject[s] || [])).join('');
  }

  function subjectCard(cat, s, files) {
    const key = cat + '::' + s;
    const impUrl = `imp.html?exam=${encodeURIComponent('DU & College')}&category=${encodeURIComponent(cat)}&subject=${encodeURIComponent(s)}&back=${encodeURIComponent('du.html')}`;
    const sylUrl = `syllabus.html?exam=${encodeURIComponent('DU & College')}&category=${encodeURIComponent(cat)}&subject=${encodeURIComponent(s)}&back=${encodeURIComponent('du.html')}`;
    const pyqUrl = `pyq.html?exam=${encodeURIComponent('DU & College')}&category=${encodeURIComponent(cat)}&subject=${encodeURIComponent(s)}&back=${encodeURIComponent('du.html')}`;
    return `
      <div class="subj-card" data-key="${escapeHtml(key)}">
        <div class="subj-head">
          <div class="subj-title">${s === 'Others' ? '📦' : '📁'} <b>${escapeHtml(s)}</b> <span class="count">${files.length} file${files.length === 1 ? '' : 's'}</span>${s === 'Others' ? '<div style="font-size:11.5px; font-weight:500; color:var(--muted); margin-top:3px;">Can’t find your subject? Check here.</div>' : ''}</div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <a class="pyq-btn" onclick="window.open('${pyqUrl}','_blank')">📜 PYQ</a>
            <a class="syl-btn" onclick="window.open('${sylUrl}','_blank')">📑 Syllabus</a>
            <a class="imp-btn" onclick="window.open('${impUrl}','_blank')">⭐ Imp Questions</a>
            ${state.isAdmin ? `` : ''}
            ${state.isAdmin ? `<button class="icon-btn" onclick="editSubject('${cat}','${encodeURIComponent(s)}')" title="Rename subject">✏️</button>` : ''}
            ${state.isAdmin ? `<button class="icon-btn del-subject-btn" onclick="deleteSubjectUI('${cat}','${encodeURIComponent(s)}')" title="Delete subject">\uD83D\uDDD1\uFE0F</button>` : ''}
          </div>
        </div>
      </div>`;
  }

  async function openAddSubject(cat) {
    if (!state.isAdmin) { alert('Only the site admin can add subjects.'); return; }
    const name = prompt('Add a new subject folder to ' + cat, '');
    if (!name || !name.trim()) return;
    try {
      const res = await fetch(`${SULAKSH_API}/api/admin/subjects`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ exam: 'DU & College', category: cat, name: name.trim() }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not add the subject.');
      loadMaterials();
    } catch (err) {
      alert(err.message);
    }
  }
  window.openAddSubject = openAddSubject;

  async function editSubject(cat, encName) {
    if (!state.isAdmin) return;
    const oldName = decodeURIComponent(encName);
    const newName = prompt('Rename "' + oldName + '" in ' + cat, oldName);
    if (!newName) return;
    const clean = newName.trim();
    if (!clean || clean === oldName) return;
    try {
      const dbRow = subjectDB.find((s) => s.category === cat && s.name === oldName);
      if (dbRow) {
        const res = await fetch(`${SULAKSH_API}/api/admin/subjects/${dbRow.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: clean }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Rename failed.');
      } else {
        const cre = await fetch(`${SULAKSH_API}/api/admin/subjects`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ exam: 'DU & College', category: cat, name: clean }),
        });
        const cdata = await cre.json().catch(() => ({}));
        if (cre.status !== 201 && cre.status !== 409) throw new Error(cdata.error || 'Could not create the subject.');
        const mats = materialsCache.filter((m) => (m.category || '').toUpperCase() === cat && (m.subject || '') === oldName);
        for (const m of mats) {
          const r = await fetch(`${SULAKSH_API}/api/admin/materials/${m.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject: clean }),
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || 'Could not move a file to the renamed subject.');
        }
        const newRow = { category: cat, name: clean };
        subjectDB = subjectDB.filter((s) => !(s.category === cat && s.name === oldName));
        subjectDB.push(newRow);
      }
      loadMaterials();
    } catch (err) {
      alert(err.message);
    }
  }
  window.editSubject = editSubject;

  async function deleteSubjectUI(cat, encName) {
    if (!state.isAdmin) return;
    const name = decodeURIComponent(encName);
    if (!window.confirm(`Delete "${name}" from ${cat}? Any files inside it will also be removed.`)) return;
    try {
      const dbRow = subjectDB.find((s) => s.category === cat && s.name === name);
      if (dbRow) {
        const res = await fetch(`${SULAKSH_API}/api/admin/subjects/${dbRow.id}`, {
          method: 'DELETE',
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Delete failed.');
      } else {
        const mats = materialsCache.filter((m) => (m.category || '').toUpperCase() === cat && (m.subject || '') === name);
        if (!mats.length) { alert('No files found for that subject.'); return; }
        for (const m of mats) {
          const r = await fetch(`${SULAKSH_API}/api/admin/materials/${m.id}`, {
            method: 'DELETE',
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || 'Could not delete a file in this subject.');
        }
      }
      loadMaterials();
    } catch (err) {
      alert(err.message);
    }
  }
  window.deleteSubjectUI = deleteSubjectUI;

  async function deleteMaterial(id, title) {
    if (!state.isAdmin) { alert('Only the site admin can delete materials.'); return; }
    if (!window.confirm(`Delete "${title}"? This cannot be undone.`)) return;
    try {
      const res = await fetch(`${SULAKSH_API}/api/admin/materials/${id}`, {
        method: 'DELETE',
        headers: {},
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Delete failed.');
      loadMaterials();
    } catch (err) {
      alert(err.message);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function materialLink(id, mode) {
    const res = await fetch(`${SULAKSH_API}/api/materials/${id}/download?disposition=${mode}`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not open this file.');
    return data.url;
  }
  async function viewMaterial(id) {
    adGate.open(async function (win) {
      const vurl = '/view.html?id=' + encodeURIComponent(id);
      if (win && !win.closed) { win.location.href = vurl; } else { window.location.href = vurl; }
    });
  }
  async function downloadMaterial(id) {
    adGate.open(async function (win) {
      try {
        var url = await materialLink(id, 'attachment');
        if (win && !win.closed) { win.location.href = url; } else { window.open(url, '_blank'); }
      } catch (e) { if (win && !win.closed) win.close(); alert(e.message); }
    });
  }

  // ---- Content reporting (visitor → admin) ----
  // Any visitor can flag a material (duplicate / copyright / irrelevant / …).
  // Visitors can ONLY create a report — they can never edit or delete a file.
  let reportMaterialId = null;
  function openReportModal(id, title) {
    reportMaterialId = id;
    document.getElementById('reportTitle').textContent =
      'Flagging: "' + title + '" — tell us what is wrong. Only admins can remove content; your report just brings it to their attention.';
    document.getElementById('reportReason').value = '';
    document.getElementById('reportDetails').value = '';
    document.getElementById('reportName').value = '';
    document.getElementById('reportEmail').value = '';
    setMsg(document.getElementById('reportMsg'), '', false);
    openModal('reportOverlay');
  }
  window.openReportModal = openReportModal;

  document.getElementById('reportSubmit').addEventListener('click', submitReport);

  async function submitReport() {
    const msg = document.getElementById('reportMsg');
    if (!reportMaterialId) return setMsg(msg, 'Something went wrong. Please close and reopen the report.', false);
    const reason = document.getElementById('reportReason').value;
    if (!reason) return setMsg(msg, 'Please select a reason.', false);

    const body = {
      material_id: reportMaterialId,
      reason,
      details: document.getElementById('reportDetails').value.trim() || undefined,
      reporter_name: document.getElementById('reportName').value.trim() || undefined,
      reporter_email: document.getElementById('reportEmail').value.trim() || undefined,
    };

    try {
      const res = await fetch(`${SULAKSH_API}/api/reports`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not submit your report.');
      setMsg(msg, 'Report submitted. Thank you — our team will review it.', true);
      setTimeout(() => closeModal('reportOverlay'), 1500);
    } catch (err) {
      setMsg(msg, err.message || 'Could not submit your report.', false);
    }
  }

  // Content renders IMMEDIATELY; the session resolves in parallel and only
  // re-renders if the role changes (admin controls appear/disappear).
  updateAuthUI();
  (function () {
    var first = document.querySelector('.mat-list');
    function go() {
      loadMaterials().then(function () {
        if (location.hash.startsWith('#c=')) setTimeout(restoreFromHash, 60);
      });
    }
    if (first && 'IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (e) { if (e.isIntersecting) { obs.disconnect(); go(); } });
      }, { rootMargin: '300px' });
      io.observe(first);
    } else {
      go();
    }
  })();
  restoreSession()
    .catch(() => {})
    .then(() => {
      const wasAdmin = document.body.classList.contains('is-admin');
      updateAuthUI();
      if ((state.isAdmin || state.canMaintain) !== wasAdmin && !window.__restoring) loadMaterials();
    });

  // Restore the active section on refresh (e.g. #cat-AEC keeps you in AEC).
  (function restoreSectionHash() {
    const h = location.hash.replace(/^#/, '');
    if (!h) return;
    const el = document.getElementById(h);
    if (!el) return;
    document.getElementById('duHome').style.display = 'none';
    document.getElementById('catPicker').classList.add('hidden');
    document.querySelectorAll('.du-cat').forEach((s) => s.classList.remove('active'));
    el.classList.add('active');
    el.scrollIntoView({ block: 'start' });
  })();
</script>

  <script src="assets/js/download-flag.js?v=1" defer></script>
  <script src="assets/js/delete-flag.js?v=1" defer></script>
