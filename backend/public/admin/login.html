<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SULAKSH Admin — Login</title>
<style>
  :root{ --navy:#0C2340; --blue:#1E5FFF; --bg:#F6F8FC; --border:#E4E9F1; --text:#1A2433; --muted:#5B6B80; --danger:#D64545; }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif; background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0;
  }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:36px; width:min(380px, 90vw); box-shadow:0 8px 30px rgba(12,35,64,.08); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .brand-mark{ width:36px; height:36px; border-radius:9px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  h1{ font-size:16px; margin:0; }
  label{ display:block; font-size:13px; font-weight:600; margin:16px 0 6px; }
  input{ width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  input:focus{ outline:none; border-color:var(--blue); }
  button{ width:100%; margin-top:22px; padding:12px; border:none; border-radius:8px; background:var(--navy); color:#fff; font-weight:600; font-size:14.5px; cursor:pointer; }
  button:disabled{ opacity:.6; cursor:default; }
  .error{ color:var(--danger); font-size:13px; margin-top:14px; min-height:16px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="brand">
      <div class="brand-mark">S</div>
      <h1>SULAKSH Admin Panel</h1>
    </div>
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">
    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Log In</button>
  </form>

<script>
  const API_BASE = window.location.origin; // adjust if admin panel is hosted separately from the API
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed.');
      window.location.href = './dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
