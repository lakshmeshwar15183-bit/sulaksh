<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification – Sulaksh</title>
<meta name="description" content="Verify a Sulaksh certificate or letter of recommendation by its reference number.">
<!-- Utility page: keep out of search indexes. No advertising on this page. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<style>
:root{ --navy:#0C2340; --blue:#1E5FFF; --bg:#F6F8FC; --card:#fff; --text:#1A2433; --muted:#5B6B80; --border:#E4E9F1; --green:#146C43; --danger:#D64545; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--border)}
.nav{max-width:720px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.5px;color:var(--navy);text-decoration:none;font-size:15px}
.spacer{flex:1}
.nav a.home{font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
.status{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin-bottom:6px}
.status .dot{width:12px;height:12px;border-radius:50%;flex:none}
.status.valid .dot{background:var(--green)} .status.valid{color:var(--green)}
.status.revoked .dot{background:var(--danger)} .status.revoked{color:var(--danger)}
.status.missing .dot{background:var(--muted)} .status.missing{color:var(--muted)}
dl{margin-top:16px;display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
dt{color:var(--muted);font-weight:600} dd{font-weight:600}
.ref{font-size:12.5px;color:var(--muted);margin-top:18px}
.search{display:flex;gap:8px;margin-top:18px}
.search input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit}
.search button{padding:10px 18px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.spin{width:34px;height:34px;border:4px solid rgba(12,35,64,.12);border-top-color:var(--blue);border-radius:50%;margin:30px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{margin-top:auto;text-align:center;font-size:12.5px;color:var(--muted);padding:22px 16px}
@media(max-width:560px){ dl{grid-template-columns:1fr;gap:2px} dd{margin-bottom:8px} }
</style>
</head>
<body>
<header><div class="nav">
  <a class="brand" href="/">SULAKSH</a><span class="spacer"></span><a class="home" href="/">Home</a>
</div></header>
<div class="wrap">
  <div class="card" id="card"><div class="spin"></div></div>
  <form class="search" id="searchForm">
    <input id="q" placeholder="Enter reference number (e.g. SUL-INT-2026-0001)" autocomplete="off" spellcheck="false">
    <button type="submit">Verify</button>
  </form>
</div>
<footer>Sulaksh · Official certificate verification</footer>
<script>
const API_BASE = 'https://sulaksh-backend-production.up.railway.app';
const card = document.getElementById('card');
const params = new URLSearchParams(location.search);

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function typeLabel(t){
  return t === 'internship' ? 'Internship Certificate'
    : t === 'participation' ? 'Participation Certificate'
    : t === 'lor' ? 'Letter of Recommendation'
    : t === 'joining' ? 'Internship Offer Letter' : 'Certificate';
}
function showMissing(number){
  document.title = 'Certificate Not Found – Sulaksh';
  card.innerHTML = `<div class="status missing"><span class="dot"></span>Certificate Not Found</div>
    <p style="font-size:14px;color:var(--muted);margin-top:8px;">No certificate exists with reference <strong>${esc(number || '—')}</strong>. Check the number and try again.</p>`;
}
function show(cert, state){
  const revoked = state === 'revoked';
  document.title = (revoked ? 'Certificate Revoked – ' : 'Certificate Verified – ') + cert.certificate_number + ' – Sulaksh';
  const dates = [cert.start_date, cert.end_date].filter(Boolean).join(' → ');
  card.innerHTML = `<div class="status ${revoked ? 'revoked' : 'valid'}"><span class="dot"></span>${revoked ? 'Certificate Revoked' : '✓ Certificate Verified'}</div>
    <dl>
      <dt>Certificate ID</dt><dd>${esc(cert.certificate_number)}</dd>
      <dt>Recipient</dt><dd>${esc(cert.recipient_name)}</dd>
      <dt>Type</dt><dd>${esc(typeLabel(cert.certificate_type))}</dd>
      <dt>Organization</dt><dd>Sulaksh</dd>
      <dt>Role / Program</dt><dd>${esc(cert.role)}</dd>
      ${cert.department ? `<dt>Department</dt><dd>${esc(cert.department)}</dd>` : ''}
      ${cert.supervisor ? `<dt>Reporting To</dt><dd>${esc(cert.supervisor)}</dd>` : ''}
      ${dates ? `<dt>Dates</dt><dd>${esc(dates)}</dd>` : ''}
      <dt>Issue date</dt><dd>${esc(cert.issue_date)}</dd>
      <dt>Issued by</dt><dd>${esc(cert.issued_by_name)}${cert.issued_by_title ? ' · ' + esc(cert.issued_by_title) : ''}</dd>
      ${cert.description ? `<dt>Details</dt><dd>${esc(cert.description)}</dd>` : ''}
    </dl>
    ${revoked ? '<p class="ref">This certificate was revoked by Sulaksh and is no longer valid.</p>' : ''}`;
}
async function fetchRetry(url, tries){
  tries = tries || 3;
  let lastErr = null;
  for (let i = 0; i < tries; i++){
    try { return await fetch(url); }
    catch(e){ lastErr = e; await new Promise(r => setTimeout(r, 900)); }
  }
  throw lastErr;
}
function showOffline(id){
  card.innerHTML = '<div class="status missing"><span class="dot"></span>Verification unavailable</div><p style="font-size:14px;color:var(--muted);margin-top:8px;">Could not reach the verification service — <u>tap here to retry</u>. On Brave/ad-block, allow this site first.</p>';
  card.style.cursor = 'pointer';
  card.onclick = () => { card.onclick = null; card.style.cursor = ''; verify(id); };
}
async function verify(number){
  const id = String(number || '').trim().toUpperCase();
  if (!id) { showMissing(''); return; }
  document.getElementById('q').value = id;
  card.onclick = null; card.style.cursor = '';
  card.innerHTML = '<div class="spin"></div>';
  try {
    const r = await fetchRetry(API_BASE + '/api/certificates/verify/' + encodeURIComponent(id));
    if (r.status === 404) { showMissing(id); return; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.certificate) { showMissing(id); return; }
    show(d.certificate, d.status);
  } catch (e) {
    showOffline(id);
  }
}
document.getElementById('searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const id = document.getElementById('q').value.trim().toUpperCase();
  history.replaceState(null, '', 'verify.html?id=' + encodeURIComponent(id));
  verify(id);
});
verify(params.get('id'));
</script>
</body>
</html>
