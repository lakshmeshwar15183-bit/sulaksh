<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Document – Sulaksh</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0e1626;height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#0C2340;color:#fff}
.topbar a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:8px}
.topbar .brand{font-family:Sora,system-ui;font-weight:800;font-size:15px;letter-spacing:.5px}
#title{flex:1;font-size:13px;color:#cfd9ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#iframeWrap{flex:1;background:#202a3a}
iframe{width:100%;height:100%;border:none}
#msg{max-width:640px;margin:60px auto;text-align:center;color:#cfd9ec;font-size:15px;line-height:1.7}
#msg a{color:#7fb0ff}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.15);border-top-color:#4d8dff;border-radius:50%;margin:80px auto 20px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">
  <a href="/du.html" id="backBtn">← Back</a>
  <span class="brand">SULAKSH</span>
  <span id="title">Loading document…</span>
</div>
<div id="iframeWrap">
  <div class="spin"></div>
  <div id="msg" style="display:block"></div>
</div>
<script>
const WORKER_API = (location.hostname === 'sulaksh.online' || location.hostname.endsWith('.sulaksh.online')) ? location.origin + '/api' : 'https://sulaksh-backend-production.up.railway.app';
const RAILWAY_API = 'https://sulaksh-backend-production.up.railway.app';
const params = new URLSearchParams(location.search);
const id = params.get('id');
function setMsg(t){ document.getElementById('msg').textContent = t; document.querySelector('.spin').style.display='none'; }
async function findCdnUrl() {
  // (1) Static snapshot — always available, never depends on the backend.
  try {
    const snap = await fetch(`${location.origin}/assets/data/materials.json`, { cache: 'no-store' });
    if (snap.ok) {
      const j = await snap.json();
      const m = (j.materials || []).find((x) => x.id === id);
      if (m && m.cdnUrl) return m.cdnUrl;
    }
  } catch (e) {}
  // (2) Backend download endpoint (worker, then direct) as a fallback.
  for (const base of [WORKER_API, RAILWAY_API]) {
    try {
      const r = await fetch(`${base}/api/materials/${id}/download?disposition=inline`, { cache: 'no-store' });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.url) return d.url;
    } catch (e) {}
  }
  return null;
}
(async () => {
  if (!id) { setMsg('No document specified.'); return; }
  const cdnUrl = await findCdnUrl();
  if (!cdnUrl) {
    document.getElementById('msg').innerHTML = 'Could not load. <a href="javascript:location.reload()" style="color:#7fb0ff">Retry</a>';
    document.querySelector('.spin').style.display = 'none';
    return;
  }
  // Defense-in-depth: only embed URLs from our own CDN/storage hosts.
  let safe = false;
  try { const u = new URL(cdnUrl); safe = u.protocol === 'https:' && (u.hostname === 'cdn.sulaksh.online' || u.hostname.endsWith('.backblazeb2.com')); } catch (e) {}
  if (!safe) { setMsg('Could not open this document.'); return; }
  document.getElementById('title').textContent = 'Sulaksh — Viewing document';
  const wrap = document.getElementById('iframeWrap');
  wrap.innerHTML = `<iframe src="${cdnUrl}" allow="autoplay" referrerpolicy="no-referrer"></iframe>`;
  const f = wrap.querySelector('iframe'); f.style.width = '100%'; f.style.height = '100%'; f.style.border = 'none';
})();
document.getElementById('backBtn').href = document.referrer || '/du.html';
</script>
</body>
</html>
