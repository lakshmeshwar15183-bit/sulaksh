<title>View Document – Sulaksh</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0e1626;height:100vh;display:flex;flex-direction:column}
main{display:flex;flex-direction:column;flex:1;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#0C2340;color:#fff}
.topbar a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:8px}
.topbar .brand{font-family:Sora,system-ui;font-weight:800;font-size:15px;letter-spacing:.5px}
.topbar .openlink{background:rgba(127,176,255,.22);color:#cfe0ff}
#title{flex:1;font-size:13px;color:#cfd9ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#iframeWrap{flex:1;min-height:0;background:#202a3a;position:relative}
iframe{width:100%;height:100%;border:none}
#msg{max-width:640px;margin:60px auto;text-align:center;color:#cfd9ec;font-size:15px;line-height:1.7}
#msg a{color:#7fb0ff}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.15);border-top-color:#4d8dff;border-radius:50%;margin:80px auto 20px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body><main>
<div class="topbar">
  <a href="/du.html" id="backBtn">← Back</a>
  <span class="brand">SULAKSH</span>
  <span id="title">Loading document…</span>
  <a href="#" id="openLink" class="openlink" target="_blank" rel="noopener" style="display:none">Open ↗</a>
</div>
<div id="iframeWrap">
  <div class="spin"></div>
  <div id="msg" style="display:block"></div>
</div>
</main><script>
const API_BASE = 'https://sulaksh-backend-production.up.railway.app';
const params = new URLSearchParams(location.search);
const id = params.get('id');
// "Open" should VIEW, not download. Linking straight to the raw .pdf makes
// browsers with "Download PDFs" enabled (or strict top-level PDF handling)
// save the file. Routing through the viewer (blob render) displays it inline
// regardless of that setting.
const openHref = 'view.html?id=' + encodeURIComponent(id);

const spin = document.querySelector('.spin');
const msg = document.getElementById('msg');
const titleEl = document.getElementById('title');
const openLink = document.getElementById('openLink');

function setMsg(html){ msg.innerHTML = html; spin.style.display = 'none'; }
function retryLink(){ return ' <a href="javascript:location.reload()" style="color:#7fb0ff">Retry</a>'; }

// Fetch with a couple of retries so a sleeping/cold backend doesn't look like
// a permanent failure. The Railway free tier can take a few seconds to wake up.
async function fetchRetry(url, opts, tries){
  tries = tries || 3;
  let lastErr;
  for (let i = 0; i < tries; i++){
    try { return await fetch(url, opts); }
    catch (e){ lastErr = e; await new Promise(r => setTimeout(r, 800)); }
  }
  throw lastErr;
}

async function findSource(){
  // (1) Static snapshot — always available, never depends on the backend.
  try {
    const snap = await fetch(`${location.origin}/assets/data/materials.json`, { cache: 'no-store' });
    if (snap.ok){
      const j = await snap.json();
      const m = (j.materials || []).find((x) => x.id === id);
      if (m && m.cdnUrl) return { url: m.cdnUrl };
    }
  } catch (e) {}

  // (2) Material detail — returns the public CDN url, NOT rate-limited.
  try {
    const r = await fetchRetry(`${API_BASE}/api/materials/${id}`);
    if (r.ok){
      const d = await r.json().catch(() => ({}));
      if (d && d.material && d.material.cdnUrl) return { url: d.material.cdnUrl };
    }
  } catch (e) {}

  // (3) Download endpoint — last resort (short-lived, per-IP daily limit).
  try {
    const r = await fetchRetry(`${API_BASE}/api/materials/${id}/download?disposition=inline`);
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.url) return { url: d.url };
    if (r.status === 429 || (d && d.error && /limit/i.test(d.error)))
      return { rateLimited: true };
  } catch (e) {}
  return null;
}

function isSafe(u){
  try {
    const x = new URL(u);
    return x.protocol === 'https:' &&
      (x.hostname === 'cdn.sulaksh.online' || x.hostname.endsWith('.backblazeb2.com'));
  } catch (e) { return false; }
}

// We no longer pre-flight with a HEAD request: it doubled load on B2 (which is
// rate-limited) and wrongly rejected image notes (JPEG/PNG/WebP). The CDN worker
// returns a clean 502 (never an HTML error page) on origin failure, so the
// <iframe> 'error' event below is enough to show a graceful fallback.

function showFallback(url, note){
  const viewerUrl = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(url);
  openLink.href = viewerUrl;
  openLink.style.display = '';
  openLink.target = '_blank';
  const html =
    '<p style="margin-bottom:14px">' + (note || 'This document could not be displayed right now.') + '</p>' +
    '<p><a href="' + viewerUrl + '" target="_blank" rel="noopener" style="color:#7fb0ff">↗ Open in viewer (no download)</a></p>' +
    retryLink();
  setMsg(html);
  // Also try to embed viewer inline
  const wrap2 = document.getElementById('iframeWrap');
  const f = document.createElement('iframe');
  f.src = viewerUrl;
  f.style.cssText = 'width:100%;height:100%;border:none;background:#fff;position:absolute;inset:0';
  wrap2.appendChild(f);
}

(async () => {
  if (!id){ setMsg('No document specified.'); return; }

  const res = await findSource();
  if (!res){
    setMsg('Could not open this document.' + retryLink());
    return;
  }
  if (res.rateLimited){
    setMsg('You’ve reached the daily view limit. Please try again tomorrow.' + retryLink());
    return;
  }

  const url = res.url;
  if (!isSafe(url)){ setMsg('Could not open this document.' + retryLink()); return; }

  titleEl.textContent = 'Sulaksh — Viewing document';
  openLink.href = openHref;
  openLink.style.display = '';
  const wrap = document.getElementById('iframeWrap');
  wrap.querySelectorAll('iframe,object,embed').forEach((e) => e.remove());

  // Mobile: use Google Docs viewer first - most reliable inline on phones
  // (blob iframe often blank on Android WebView, direct CDN triggers Download)
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isTouch) {
    spin.style.display = 'block';
    msg.textContent = 'Loading viewer…';
    msg.style.display = 'block';
    const viewerUrl = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(url);
    openLink.href = viewerUrl;
    openLink.target = '_blank';
    openLink.style.display = '';
    const f = document.createElement('iframe');
    f.src = viewerUrl;
    f.style.cssText = 'width:100%;height:100%;border:none;background:#fff';
    f.setAttribute('referrerpolicy', 'no-referrer');
    let viewerLoaded = false;
    f.addEventListener('load', () => { viewerLoaded = true; spin.style.display = 'none'; msg.style.display = 'none'; });
    f.addEventListener('error', async () => {
      if (viewerLoaded) return;
      // Fallback: try blob inline if gview blocked
      try {
        const r = await fetchRetry(url, { mode: 'cors' }, 2);
        if (!r.ok) throw new Error();
        const blob = await r.blob();
        const blobUrl = URL.createObjectURL(blob);
        f.src = blobUrl;
        openLink.href = blobUrl;
      } catch (e) {
        showFallback(url, 'Viewer failed. Tap to open inline.');
      }
    });
    wrap.appendChild(f);
    // If gview doesn't load in 8s, fallback to blob
    setTimeout(async () => {
      if (viewerLoaded) return;
      try {
        const r = await fetch(url, { mode: 'cors' });
        if (r.ok) {
          const blob = await r.blob();
          const blobUrl = URL.createObjectURL(blob);
          f.src = blobUrl;
          openLink.href = blobUrl;
          spin.style.display = 'none';
          msg.style.display = 'none';
        }
      } catch (e) {}
    }, 8000);
    return;
  }

  let loaded = false;
  function showDoc(blobUrl){
    const f = document.createElement('iframe');
    f.src = blobUrl;
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.style.width = '100%'; f.style.height = '100%'; f.style.border = 'none';
    f.addEventListener('load', () => { loaded = true; spin.style.display = 'none'; try { URL.revokeObjectURL(blobUrl); } catch (e) {} });
    f.addEventListener('error', () => {
      if (!loaded) showFallback(url, 'This document could not be displayed inline. Trying viewer…');
    });
    wrap.appendChild(f);
  }

  // Android Chrome / iOS Safari block cross-origin PDF frames ("content blocked").
  // So we fetch the file (the CDN sends Access-Control-Allow-Origin: *) and render
  // it from a same-origin blob: URL, which the browser displays inline like on desktop.
  try {
    const r = await fetchRetry(url, { mode: 'cors' }, 2);
    if (!r.ok) throw new Error('status ' + r.status);
    const blob = await r.blob();
    showDoc(URL.createObjectURL(blob));
  } catch (e) {
    showFallback(url, 'This document could not be loaded inline. Opening viewer…');
  }

  // If the embed is slow or blocked, still offer a direct link.
  setTimeout(() => {
    if (loaded) return;
    const note = document.createElement('div');
    note.style.cssText = 'position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#cfd9ec;font-size:13px';
    const viewerFallback = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(url);
    note.innerHTML = 'Taking too long? <a href="' + viewerFallback + '" target="_blank" rel="noopener" style="color:#7fb0ff">Open in viewer</a>';
    wrap.appendChild(note);
  }, 12000);
})();

document.getElementById('backBtn').href = document.referrer || '/du.html';
</script>

<!-- Cookie Consent - GDPR / AdSense -->
<style>
.cookie-consent{position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;display:none;justify-content:center;pointer-events:none;}
.cookie-consent.show{display:flex;pointer-events:auto;}
.cookie-consent__inner{max-width:860px;width:100%;background:var(--card, #fff);border:1px solid var(--border, #E4E9F1);border-radius:14px;box-shadow:0 12px 40px rgba(12,35,64,.18);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.cookie-consent__text{flex:1 1 280px;font-size:13.5px;line-height:1.6;color:var(--text, #1A2433);margin:0;}
.cookie-consent__text a{color:var(--blue, #1E5FFF);font-weight:600;text-decoration:underline;text-underline-offset:2px;}
.cookie-consent__actions{display:flex;gap:8px;flex-shrink:0;align-items:center;}
.cookie-btn{padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:transform .15s, background .2s;}
.cookie-btn--accept{background:var(--navy, #0C2340);color:#fff;border-color:var(--navy, #0C2340);}
.cookie-btn--accept:hover{background:var(--blue, #1E5FFF);transform:translateY(-1px);}
.cookie-btn--decline{background:var(--bg, #F6F8FC);color:var(--text, #1A2433);border-color:var(--border, #E4E9F1);}
.cookie-btn--decline:hover{background:var(--border, #E4E9F1);}
@media(max-width:640px){.cookie-consent{left:10px;right:10px;bottom:10px;}.cookie-consent__inner{padding:14px;}.cookie-consent__actions{width:100%;justify-content:flex-end;}}
</style>
<div id="cookieConsent" class="cookie-consent" role="dialog" aria-label="Cookie consent" aria-live="polite">
  <div class="cookie-consent__inner">
    <p class="cookie-consent__text">We use cookies to remember your theme, improve our site and show relevant ads (Google AdSense). Choose Accept to allow personalised ads and analytics, or Decline for essential cookies only. <a href="privacy-policy.html">Privacy Policy</a>.</p>
    <div class="cookie-consent__actions">
      <button id="cookieDecline" class="cookie-btn cookie-btn--decline" type="button">Decline</button>
      <button id="cookieAccept" class="cookie-btn cookie-btn--accept" type="button">Accept</button>
    </div>
  </div>
</div>
<script>
(function(){
  var KEY='sulaksh-consent';
  var banner=document.getElementById('cookieConsent');
  var acceptBtn=document.getElementById('cookieAccept');
  var declineBtn=document.getElementById('cookieDecline');
  function getConsent(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
  function setConsent(v){try{localStorage.setItem(KEY,v);}catch(e){}}
  function updateGtag(grant){
    try{
      if(typeof gtag==='function'){
        gtag('consent','update',{
          'ad_storage': grant?'granted':'denied',
          'ad_user_data': grant?'granted':'denied',
          'ad_personalization': grant?'granted':'denied',
          'analytics_storage': grant?'granted':'denied'
        });
      }
    }catch(e){}
  }
  function hide(){ if(banner) banner.classList.remove('show'); setTimeout(function(){ if(banner) banner.style.display='none';},250); }
  function show(){ if(!banner) return; banner.style.display='flex'; requestAnimationFrame(function(){ banner.classList.add('show'); }); }
  var c=getConsent();
  if(c==='accepted'){ updateGtag(true); }
  else if(c==='declined'){ updateGtag(false); }
  else { setTimeout(show, 700); }
  if(acceptBtn) acceptBtn.addEventListener('click', function(){ setConsent('accepted'); updateGtag(true); hide(); try{if(window.__sgLoadAds) window.__sgLoadAds();}catch(e){} });
  if(declineBtn) declineBtn.addEventListener('click', function(){ setConsent('declined'); updateGtag(false); hide(); });
})();
</script>

</body>
