name: SEO refresh

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SEO pages from live catalog
        env:
          SULAKSH_API: https://sulaksh-backend-production.up.railway.app
        run: node scripts/generate-seo.mjs

      - name: Commit new pages (main)
        run: |
          git config user.name "sulaksh-seo-bot"
          git config user.email "bot@sulaksh.online"
          git add -A
          git diff --cached --quiet || git commit -m "SEO auto-refresh $(date -u '+%F %H:%M') UTC"
          git push origin main

      - name: Deploy FULL tree to gh-pages (nothing missed)
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git reset --hard origin/gh-pages
          # sync ENTIRE tree from main except backend source folder
          git checkout main -- . ':!backend'
          git add -A
          git diff --cached --quiet || git commit -m "full sync $(date -u '+%F %H:%M') UTC"
          git push origin gh-pages

      - name: Purge Cloudflare cache and cache-bust
        if: always()
        run: |
          # Best-effort Cloudflare purge (skips if secrets not set — still does warm fetch)
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ZONE_ID }}" ]; then
            echo "Purging Cloudflare cache..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || echo "Purge via API failed (continuing)"
          else
            echo "No Cloudflare secrets — skipping API purge (relying on edge max-age + warm fetch)"
          fi
          sleep 10
          for url in "https://sulaksh.online/" "https://sulaksh.online/du.html" "https://sulaksh.online/index.html"; do
            echo "Warm fetch $url?purge=$(date +%s)"
            curl -s "$url?purge=$(date +%s)" > /dev/null || true
            if curl -s "$url?purge=$(date +%s)" | grep -qi "mobile view is limited"; then
              echo "ERROR: banner still in $url"
              exit 1
            else
              echo "OK: banner gone in $url"
            fi
          done

      - name: Smoke test key pages
        run: |
          sleep 60
          for u in "" view.html du.html pyq/index.html sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://sulaksh.online/$u")
            echo "$u → $code"
          done
