name: SEO refresh

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SEO pages from live catalog
        env:
          SULAKSH_API: https://sulaksh-backend-production.up.railway.app
        run: node scripts/generate-seo.mjs

      - name: Commit new pages (main)
        run: |
          git config user.name "sulaksh-seo-bot"
          git config user.email "bot@sulaksh.online"
          git add -A
          git diff --cached --quiet || git commit -m "SEO auto-refresh $(date -u '+%F %H:%M') UTC"
          git push origin main

      - name: Deploy pages (gh-pages)
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          # Only ship static site assets. Never publish backend/scripts source.
          git checkout main -- pyq sitemap.xml index.html du.html || true
          git add -A
          git diff --cached --quiet || git commit -m "SEO sync $(date -u '+%F %H:%M') UTC"
          git push origin gh-pages
