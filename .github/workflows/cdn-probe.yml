name: CDN probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CDN download speed
        run: |
          for i in 1 2; do
            curl -sS -o /dev/null -w "%{http_code} %{size_download} bytes %{time_total}s %{speed_download} B/s\n" \
              --max-time 45 \
              "https://cdn.sulaksh.online/file/materials/pyq-archive/pyq/undated/f0c196ec-85e5-4286-87b3-b9e1d43a0dee.pdf?disposition=inline&cb=$RANDOM"
          done
