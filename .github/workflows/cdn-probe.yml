name: CDN probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe uncached large CDN file
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null -w "%{http_code} %{size_download} bytes %{time_total}s %{speed_download} B/s\n" \
              --max-time 60 \
              "https://cdn.sulaksh.online/file/materials/pyq-archive/pyq/undated/02579c07-3dd7-42a9-a065-bbb6158d3e64.pdf?disposition=inline&cb=$RANDOM-$i"
          done
