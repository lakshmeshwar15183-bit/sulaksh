name: CDN probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe sequential and parallel CDN requests
        run: |
          head -40 scripts/archive-data/keys.txt > /tmp/probe-keys.txt
          echo "--- sequential 40 ---"
          while read -r k; do
            curl -sS -o /dev/null -w "%{http_code} %{time_total}\n" --max-time 30 \
              "https://cdn.sulaksh.online/file/$k?disposition=inline&cb=$RANDOM"
          done < /tmp/probe-keys.txt > /tmp/seq.txt
          awk '{c[$1]++; t+=$2} END {for (s in c) print "status",s,"count",c[s]; print "avg sec",t/NR}' /tmp/seq.txt
          echo "--- parallel 8 ---"
          cat /tmp/probe-keys.txt | xargs -P 8 -I{} sh -c \
            'curl -sS -o /dev/null -w "%{http_code} %{time_total}\n" --max-time 30 "https://cdn.sulaksh.online/file/{}?disposition=inline&cb=$RANDOM"' > /tmp/par.txt
          awk '{c[$1]++; t+=$2} END {for (s in c) print "status",s,"count",c[s]; print "avg sec",t/NR}' /tmp/par.txt
