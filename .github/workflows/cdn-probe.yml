name: CDN probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CDN download speed
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null -w "%{http_code} %{size_download} bytes %{time_total}s\n" \
              --max-time 30 \
              "https://cdn.sulaksh.online/file/materials/pyq-archive/pyq/2023/05cbf06a-f805-40c8-ac9d-37d62f0dd9e2.pdf?disposition=inline&cb=$RANDOM"
          done
