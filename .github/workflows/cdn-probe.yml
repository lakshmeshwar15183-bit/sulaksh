name: CDN probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe 40 parallel CDN requests
        run: |
          head -40 scripts/archive-data/keys.txt > /tmp/probe-keys.txt
          cat /tmp/probe-keys.txt | xargs -P 40 -I{} sh -c \
            'curl -sS -o /dev/null -w "%{http_code} %{time_total}\n" --max-time 60 "https://cdn.sulaksh.online/file/{}?disposition=inline&cb=$RANDOM"' > /tmp/par.txt
          awk '{c[$1]++; t+=$2; if($2>m)m=$2} END {for (s in c) print "status",s,"count",c[s]; print "avg sec",t/NR,"max sec",m}' /tmp/par.txt
